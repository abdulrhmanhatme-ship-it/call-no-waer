  <line x1="190" y1="390" x2="322" y2="390" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <line x1="210" y1="420" x2="302" y2="420" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <!-- Screen LCD -->
