  <!-- Screen Wave -->
  <path d="M 185 245 Q 210 215, 230 245 T 275 245 T 320 245" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="215" r="4" fill="#34d399"/>
